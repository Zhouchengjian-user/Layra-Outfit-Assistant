<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">易搭 AI 穿搭助手线上产品架构图</title>
  <desc id="desc">展示用户、API 网关、veFaaS Next.js 应用、核心业务模块、AI 模型、数据库和对象存储之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#4c7df0"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e7"/>
      <stop offset="1" stop-color="#fff1cf"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebfbf6"/>
      <stop offset="1" stop-color="#dcf7ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#29335c" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#697394"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c5ce7"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2747; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #697394; }
      .section { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2b345a; }
      .card-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #273052; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #68708b; }
      .inverse-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .inverse-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e7eaff; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #697394; }
      .pill { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5b52c7; }
      .line { fill: none; stroke: #697394; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-brand { fill: none; stroke: #6c5ce7; stroke-width: 2.5; marker-end: url(#arrowPurple); }
      .line-dash { fill: none; stroke: #8490ad; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="170" fill="#8c7cf0" opacity="0.07"/>
  <circle cx="90" cy="1010" r="230" fill="#4c9bee" opacity="0.06"/>

  <text x="80" y="72" class="title">易搭 · AI 穿搭助手</text>
  <text x="80" y="105" class="subtitle">线上产品架构 · 火山引擎 veFaaS 轻量生产方案</text>
  <rect x="1305" y="48" width="215" height="42" rx="21" fill="#ebe9ff"/>
  <text x="1412" y="74" text-anchor="middle" class="pill">CURRENT PRODUCTION</text>

  <!-- Access layer -->
  <rect x="70" y="150" width="1460" height="142" rx="24" fill="#ffffff" stroke="#dfe4f2" filter="url(#shadow)"/>
  <text x="98" y="184" class="section">访问层</text>

  <rect x="110" y="204" width="270" height="62" rx="16" fill="#f3f1ff" stroke="#d9d4ff"/>
  <circle cx="147" cy="235" r="17" fill="#6c5ce7"/>
  <rect x="140" y="224" width="14" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="147" cy="242" r="1.5" fill="#fff"/>
  <text x="178" y="230" class="card-title">用户端</text>
  <text x="178" y="251" class="card-body">手机浏览器 · H5</text>

  <path d="M380 235 H515" class="line-brand"/>
  <text x="447" y="220" text-anchor="middle" class="label">HTTPS</text>

  <rect x="520" y="204" width="310" height="62" rx="16" fill="#eef4ff" stroke="#cddcff"/>
  <text x="555" y="230" class="card-title">Serverless API 网关</text>
  <text x="555" y="251" class="card-body">公网域名 · 路由转发 · HTTPS 入口</text>

  <path d="M830 235 H965" class="line-brand"/>
  <text x="897" y="220" text-anchor="middle" class="label">全量路由</text>

  <rect x="970" y="194" width="440" height="82" rx="18" fill="url(#brand)"/>
  <text x="1005" y="228" class="inverse-title">veFaaS Web 应用函数</text>
  <text x="1005" y="253" class="inverse-body">Next.js Standalone · Node.js · 单实例 min=max=1</text>

  <!-- Application layer -->
  <rect x="70" y="326" width="960" height="492" rx="26" fill="#ffffff" stroke="#dfe4f2" filter="url(#shadow)"/>
  <text x="98" y="362" class="section">Next.js 全栈应用</text>
  <rect x="832" y="342" width="168" height="30" rx="15" fill="#f1efff"/>
  <text x="916" y="362" text-anchor="middle" class="pill">React 19 + App Router</text>

  <rect x="105" y="394" width="390" height="78" rx="18" fill="#f5f3ff" stroke="#dcd7ff"/>
  <text x="130" y="424" class="card-title">移动端产品界面</text>
  <text x="130" y="449" class="card-body">衣柜 · 搭配推荐 · 收藏 · 个人试穿</text>

  <rect x="605" y="394" width="390" height="78" rx="18" fill="#f5f3ff" stroke="#dcd7ff"/>
  <text x="630" y="424" class="card-title">认证与安全边界</text>
  <text x="630" y="449" class="card-body">邀请码 · 签名 Cookie · 用户数据隔离 · Trace ID</text>

  <path d="M495 433 H605" class="line-brand"/>

  <rect x="105" y="512" width="270" height="112" rx="18" fill="#ffffff" stroke="#ccd5e9"/>
  <circle cx="135" cy="542" r="14" fill="#eeeaff"/>
  <text x="135" y="547" text-anchor="middle" class="pill">01</text>
  <text x="160" y="548" class="card-title">智能衣柜</text>
  <text x="130" y="578" class="card-body">照片识别 · 单品裁剪</text>
  <text x="130" y="600" class="card-body">白底商品图 · AI 标签</text>

  <rect x="405" y="512" width="270" height="112" rx="18" fill="#ffffff" stroke="#ccd5e9"/>
  <circle cx="435" cy="542" r="14" fill="#eeeaff"/>
  <text x="435" y="547" text-anchor="middle" class="pill">02</text>
  <text x="460" y="548" class="card-title">穿搭推荐</text>
  <text x="430" y="578" class="card-body">规则评分 · AI 精选</text>
  <text x="430" y="600" class="card-body">天气与场景适配</text>

  <rect x="705" y="512" width="270" height="112" rx="18" fill="#ffffff" stroke="#ccd5e9"/>
  <circle cx="735" cy="542" r="14" fill="#eeeaff"/>
  <text x="735" y="547" text-anchor="middle" class="pill">03</text>
  <text x="760" y="548" class="card-title">个人试穿</text>
  <text x="730" y="578" class="card-body">全身照 + 衣柜单品</text>
  <text x="730" y="600" class="card-body">生成写实穿搭效果图</text>

  <path d="M300 472 V512" class="line"/>
  <path d="M700 472 V492 H540 V512" class="line"/>
  <path d="M800 472 V512" class="line"/>

  <rect x="105" y="665" width="870" height="116" rx="18" fill="#f8f9fd" stroke="#d8deec"/>
  <text x="132" y="698" class="card-title">统一服务层</text>
  <rect x="130" y="718" width="184" height="38" rx="11" fill="#ffffff" stroke="#d9deea"/>
  <text x="222" y="742" text-anchor="middle" class="card-body">API Routes</text>
  <rect x="330" y="718" width="184" height="38" rx="11" fill="#ffffff" stroke="#d9deea"/>
  <text x="422" y="742" text-anchor="middle" class="card-body">AI 任务与幂等</text>
  <rect x="530" y="718" width="184" height="38" rx="11" fill="#ffffff" stroke="#d9deea"/>
  <text x="622" y="742" text-anchor="middle" class="card-body">数据库抽象</text>
  <rect x="730" y="718" width="220" height="38" rx="11" fill="#ffffff" stroke="#d9deea"/>
  <text x="840" y="742" text-anchor="middle" class="card-body">对象存储抽象</text>

  <path d="M240 624 V665" class="line"/>
  <path d="M540 624 V665" class="line"/>
  <path d="M840 624 V665" class="line"/>

  <!-- External AI -->
  <rect x="1070" y="326" width="460" height="492" rx="26" fill="url(#ai)" stroke="#f0d99f" filter="url(#shadow)"/>
  <text x="1098" y="362" class="section">AI 与数据服务</text>

  <rect x="1105" y="394" width="390" height="86" rx="18" fill="#ffffff" stroke="#efd59a"/>
  <text x="1130" y="425" class="card-title">Qwen3-VL-Flash</text>
  <text x="1130" y="451" class="card-body">衣物识别 · 标签质检 · 推荐精选与点评</text>

  <rect x="1105" y="505" width="390" height="86" rx="18" fill="#ffffff" stroke="#efd59a"/>
  <text x="1130" y="536" class="card-title">Qwen-Image 2.0</text>
  <text x="1130" y="562" class="card-body">1536 × 1536 高清白底商品图</text>

  <rect x="1105" y="616" width="390" height="86" rx="18" fill="#ffffff" stroke="#efd59a"/>
  <text x="1130" y="647" class="card-title">Doubao Seedream 5.0 Lite</text>
  <text x="1130" y="673" class="card-body">个人全身穿搭试穿效果图</text>

  <rect x="1105" y="727" width="390" height="62" rx="18" fill="#ffffff" stroke="#efd59a"/>
  <text x="1130" y="754" class="card-title">Open-Meteo</text>
  <text x="1280" y="754" class="card-body">实时天气数据</text>

  <path d="M1030 550 H1070" class="line"/>
  <path d="M1030 580 H1050 V659 H1070" class="line"/>
  <path d="M1030 610 H1042 V758 H1070" class="line"/>

  <!-- Data layer -->
  <rect x="70" y="852" width="1460" height="178" rx="26" fill="url(#data)" stroke="#bfe7dc" filter="url(#shadow)"/>
  <text x="98" y="888" class="section">数据与持久化</text>

  <rect x="110" y="912" width="360" height="82" rx="18" fill="#ffffff" stroke="#b8ded4"/>
  <text x="138" y="944" class="card-title">SQLite 业务数据库</text>
  <text x="138" y="970" class="card-body">/tmp/data/yida.sqlite · 当前单实例生产方案</text>

  <rect x="620" y="912" width="360" height="82" rx="18" fill="#ffffff" stroke="#b8ded4"/>
  <text x="648" y="944" class="card-title">TOS 对象存储</text>
  <text x="648" y="970" class="card-body">原图 · 商品图 · 模特照 · 试穿图</text>

  <rect x="1130" y="912" width="360" height="82" rx="18" fill="#ffffff" stroke="#b8ded4"/>
  <text x="1158" y="944" class="card-title">SQLite 固定键快照</text>
  <text x="1158" y="970" class="card-body">db_backup/yida.sqlite · 自动备份与恢复</text>

  <path d="M470 953 H620" class="line-brand"/>
  <text x="545" y="936" text-anchor="middle" class="label">业务图片</text>
  <path d="M980 953 H1130" class="line-brand"/>
  <text x="1055" y="936" text-anchor="middle" class="label">定时快照</text>
  <path d="M1130 980 C1030 1040,570 1040,470 980" class="line-dash"/>
  <text x="800" y="1021" text-anchor="middle" class="label">新实例启动时校验并自动恢复</text>

  <path d="M620 781 V832 H290 V912" class="line"/>
  <path d="M840 781 V832 H800 V912" class="line"/>

  <text x="80" y="1060" class="subtitle">生产安全边界：邀请码登录 · 用户数据隔离 · 请求级 STS · 密钥仅存服务端环境变量</text>
</svg>
